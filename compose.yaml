services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: experiencenet
      POSTGRES_USER: experiencenet
      POSTGRES_PASSWORD: experiencenet_dev_only
    ports:
      - "5433:5432"
    volumes:
      - experiencenet_pg:/var/lib/postgresql/data

volumes:
  experiencenet_pg:
