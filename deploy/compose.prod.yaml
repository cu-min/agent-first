x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentfirst
      POSTGRES_USER: agentfirst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - agentfirst_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfirst -d agentfirst"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    logging: *default-logging
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agentfirst:${POSTGRES_PASSWORD}@db:5432/agentfirst
      BIND_ADDR: 0.0.0.0:8080
      APP_ORIGIN: https://${DOMAIN}
      STATIC_DIR: /app/web
      TRUSTED_PROXIES: 172.16.0.0/12
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    logging: *default-logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请在 .env 中设置 ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - agentfirst_caddy_data:/data
      - agentfirst_caddy_config:/config
    depends_on:
      - server

  backup:
    logging: *default-logging
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U agentfirst -d agentfirst -Fc -f /backups/agentfirst-$$(date +%Y%m%d-%H%M).dump
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  agentfirst_pg:
  agentfirst_caddy_data:
  agentfirst_caddy_config:
